<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>CAD Mission – Technical Explorer</title>
<style>
:root{
  --bg:#0f141d;
  --grid:rgba(0, 240, 255, 0.05);
  --grid-bold:rgba(0, 240, 255, 0.12);
  --card:#18202c;
  --card-border:#2a3649;
  --ink:#e1e7ed;
  --mut:#8b9eb3;
  --acc:#d62839;
  --cad-cyan:#00f0ff;
  --cad-yellow:#ffd166;
  --cad-green:#00e676;
  --okbg:#0f3822;
  --badbg:#3d1418;
  --sel:#132e48;
  box-sizing:border-box;
}

html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{
  margin:0;
  font:15px/1.5 "Segoe UI", -apple-system, Roboto, monospace;
  background:var(--bg);
  color:var(--ink);
  background-image: 
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(var(--grid-bold) 2px, transparent 2px),
    linear-gradient(90deg, var(--grid-bold) 2px, transparent 2px);
  background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
  background-position: -1px -1px;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

.mono{font-family:ui-monospace, Consolas, "Courier New", monospace}

header{
  position:sticky;
  top:0;
  z-index:9;
  background:#111722;
  border-bottom:2px solid var(--cad-cyan);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 16px;
  padding-top:max(10px, env(safe-area-inset-top));
  flex-wrap:wrap;
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
  transition: transform 0.4s ease, opacity 0.4s ease;
}
header.hidden-header {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
  position: absolute;
}

.logo{font-weight:800;letter-spacing:1px;font-size:18px;display:flex;align-items:center;gap:8px}
.logo-icon{width:24px;height:24px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:900;border-radius:4px;font-size:14px}
.logo b{color:var(--cad-cyan)}

.hud{display:flex;gap:6px;align-items:center;font-size:13px;flex-wrap:wrap}
.hud span{
  background:#1b2535;
  border:1px solid var(--card-border);
  border-radius:6px;
  padding:4px 9px;
  white-space:nowrap;
  color:var(--ink);
}
.hud button{
  border:1px solid var(--card-border);
  background:#1b2535;
  color:var(--ink);
  border-radius:6px;
  padding:4px 10px;
  cursor:pointer;
  min-height:30px;
}

main{
  max-width:880px;
  width:100%;
  margin:auto;
  padding:16px 12px 36px;
  padding-bottom:max(36px, env(safe-area-inset-bottom));
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.panel{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:12px;
  padding:24px;
  box-shadow:0 12px 40px rgba(0,0,0,0.6);
  position:relative;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  transform-origin: center;
}

.panel.morphing {
  opacity: 0;
  transform: scale(0.95) translateY(10px);
}

.panel.flash-ok {
  box-shadow: 0 0 0 2px var(--cad-green), 0 12px 40px rgba(0, 230, 118, 0.25);
}
.panel.flash-bad {
  box-shadow: 0 0 0 2px var(--acc), 0 12px 40px rgba(214, 40, 57, 0.28);
  animation: sk .4s;
}

.splash-content {
  text-align: center;
  padding: 28px 10px;
}
.splash-title {
  font-size: clamp(24px, 5vw, 34px);
  font-weight: 800;
  color: #fff;
  margin-bottom: 12px;
  letter-spacing: 1px;
}
.splash-title span {
  color: var(--cad-cyan);
}
.splash-subtitle {
  color: var(--mut);
  font-size: clamp(14px, 3.5vw, 16px);
  max-width: 520px;
  margin: 0 auto 28px;
  line-height: 1.6;
}

/* Halaman sambutan: tata letak lebih terstruktur dan visual */
.splash-content{padding:clamp(16px,3vw,30px) 4px;text-align:center}
.splash-mark{font-size:clamp(38px,5vw,54px);margin:0 0 10px;display:inline-grid;place-items:center;width:76px;height:76px;border-radius:22px;background:linear-gradient(145deg,rgba(0,240,255,.12),rgba(0,136,255,.08));border:1px solid rgba(0,240,255,.24);box-shadow:0 10px 28px rgba(0,136,255,.1)}
.splash-title{font-size:clamp(23px,3.6vw,34px);line-height:1.2;margin:0 0 10px;letter-spacing:.6px;text-wrap:balance}
.splash-intro{max-width:650px;margin:0 auto 20px;color:var(--mut);font-size:14px;line-height:1.65}
.splash-badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 auto 22px;max-width:720px}
.splash-badge{border:1px solid rgba(0,240,255,.25);background:rgba(0,240,255,.06);color:var(--cad-cyan);border-radius:999px;padding:7px 12px;font-size:11px;font-weight:800;letter-spacing:.25px}
.welcome-info{max-width:900px;margin:0 auto 22px;text-align:left;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.welcome-block{background:linear-gradient(145deg,#141f2e,#101823);border:1px solid rgba(133,158,190,.18);border-radius:13px;padding:16px 17px;min-width:0;box-shadow:0 7px 18px rgba(0,0,0,.12)}
.welcome-block h3{font-size:12px;color:var(--cad-cyan);margin:0 0 11px;letter-spacing:.65px;display:flex;align-items:center;gap:7px}
.welcome-block p{margin:7px 0;font-size:12.5px;line-height:1.58;color:var(--ink)}
.welcome-block strong{color:#fff}
.welcome-block ul{margin:4px 0 0;padding-left:18px;font-size:12.5px;line-height:1.65}
.welcome-block li{margin:2px 0}
.welcome-kd p{padding:9px 11px;margin:7px 0;background:rgba(5,12,20,.38);border:1px solid rgba(133,158,190,.12);border-radius:8px}
.welcome-objective{border-color:rgba(255,209,102,.28);background:linear-gradient(135deg,rgba(255,209,102,.07),#17212c 58%)}
.welcome-objective h3{color:var(--cad-yellow)}
.welcome-objective p{font-size:13px;line-height:1.7}
.splash-cta{margin-top:4px;min-width:190px}

/* Kamus CAD: layout kartu ringkas, satu kolom, tanpa panel kecil bertumpuk */
.cg{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.command-card{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;background:#121b28;border:1px solid var(--card-border);border-radius:10px;padding:12px;margin:10px 0;align-items:start}
.command-symbol{width:52px;height:52px;border:1px solid rgba(0,240,255,.28);background:rgba(0,240,255,.06);color:var(--cad-cyan);border-radius:8px;display:grid;place-items:center}
.command-symbol svg{width:34px;height:34px}
.command-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 4px}
.command-head h4{margin:0;font-size:16px}
.command-alias{font-family:ui-monospace,monospace;color:var(--cad-yellow);background:#202a39;border-radius:5px;padding:2px 6px;font-size:11px}
.command-card p{margin:5px 0;font-size:12.5px;line-height:1.5;color:var(--ink)}
.command-concept,.command-example{grid-column:1/-1;border-top:1px solid #263449;padding-top:8px;margin-top:2px}
.command-concept b,.command-example b{color:var(--cad-cyan);font-size:12px}
.command-visual{grid-column:1/-1;display:flex;align-items:center;gap:10px;background:#0d131c;border:1px solid #263449;border-radius:8px;padding:8px 10px;margin-top:4px;min-width:0}
.command-visual svg.diagram{width:108px;height:58px;flex:none;display:block}
.command-visual .visual-copy{min-width:0}
.command-visual b{font-size:12px;color:#fff;display:block}
.command-visual small{font-size:11px;color:var(--mut);display:block;line-height:1.4}
@media(max-width:650px){.welcome-info{grid-template-columns:1fr}.splash-content{padding:12px 0}.welcome-block{padding:13px}.command-card{grid-template-columns:44px minmax(0,1fr);padding:10px}.command-symbol{width:42px;height:42px}.command-symbol svg{width:30px;height:30px}.command-visual svg.diagram{width:88px;height:50px}}

.pulse-btn {
  background: linear-gradient(135deg, var(--cad-cyan), #0088ff);
  color: #05070a;
  font-size: 16px;
  padding: 14px 32px;
  border-radius: 8px;
  font-weight: 800;
  box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
  animation: pulse 2s infinite;
  border: 0;
  cursor: pointer;
  min-height: 48px;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.5); }
  70% { box-shadow: 0 0 0 15px rgba(0, 240, 255, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
}

h1,h2{margin:.2em 0 .4em;line-height:1.25;color:#fff}
h1{font-size:clamp(20px, 4.5vw, 26px);border-bottom:1px solid var(--card-border);padding-bottom:8px}
h2{font-size:clamp(18px, 4vw, 20px);color:var(--cad-cyan)}
.mut{color:var(--mut);margin:.2em 0 .9em;font-size:14px}

.btn{
  background:var(--cad-cyan);
  color:#0f141d;
  border:0;
  border-radius:8px;
  padding:11px 18px;
  font:inherit;
  font-weight:700;
  cursor:pointer;
  transition:.18s;
  letter-spacing:.4px;
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.btn:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:scale(0.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--card-border)}
.btn.ghost:hover:not(:disabled){border-color:var(--cad-cyan);color:var(--cad-cyan)}
.btn.confirm-btn{background:var(--cad-yellow);color:#0f141d;box-shadow:0 4px 14px rgba(255,209,102,0.28)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn[hidden]{display:none !important}

.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;font-size:12px}
.steps span{padding:4px 10px;border-radius:4px;border:1px solid var(--card-border);color:var(--mut);background:#111722}
.steps .on{background:var(--sel);border-color:var(--cad-cyan);color:var(--cad-cyan);font-weight:700}
.steps .dn{background:var(--okbg);color:var(--cad-green);border-color:var(--cad-green)}

.strip{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0;background:#111722;padding:12px;border-radius:8px;border:1px dashed var(--card-border)}
.strip svg{width:32px;height:32px;color:var(--cad-cyan);animation:fl 2.4s ease-in-out infinite}
.strip svg:nth-child(2n){animation-delay:.6s;color:var(--cad-yellow)}
.strip svg:nth-child(3n){animation-delay:1.2s;color:var(--acc)}
@keyframes fl{50%{transform:translateY(-4px)}}

input, select{
  font-family:ui-monospace, Consolas, monospace;
  padding:12px 14px;
  border-radius:8px;
  border:1px solid var(--card-border);
  background:#111722;
  color:var(--cad-cyan);
  min-width:0;
  font-size:16px;
}
input:focus{outline:2px solid var(--cad-cyan)}

.mg{display:grid;grid-template-columns:1fr 1.25fr;gap:12px}
.col{display:flex;flex-direction:column;gap:10px}

.m{
  border:1.5px solid var(--card-border);
  background:#111722;
  border-radius:8px;
  padding:12px 14px;
  min-height:54px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  transition:all .18s ease;
  user-select:none;
  font-size:14px;
  position:relative;
}
.m:hover{border-color:var(--cad-cyan);background:var(--sel)}
.m.sel{
  border-color:var(--cad-cyan);
  background:var(--sel);
  box-shadow:0 0 14px rgba(0,240,255,0.28);
  transform:translateX(3px);
}
.m.ok{
  border-color:var(--cad-green);
  background:var(--okbg);
  pointer-events:none;
  color:#d4ffe6;
  animation:popOk .38s cubic-bezier(.2,1.4,.4,1);
}
.m.bad{
  border-color:var(--acc);
  background:var(--badbg);
  color:#ffb3ba;
  animation:sk .4s;
}

@keyframes popOk{
  0%{transform:scale(0.97)}
  50%{transform:scale(1.02)}
  100%{transform:scale(1)}
}
@keyframes sk{
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}

.m.l svg{width:36px;height:36px;color:var(--cad-cyan);margin:0 auto;flex-shrink:0}
.m.l:has(.mini) svg{width:26px;height:26px;margin:0}
.mini{display:flex;align-items:center}

.prog{height:6px;background:#111722;border-radius:4px;margin-top:16px;overflow:hidden;border:1px solid var(--card-border)}
.prog i{display:block;height:100%;width:0;background:var(--cad-cyan);transition:width .4s}

.q{background:#111722;border-left:4px solid var(--cad-cyan);padding:14px 16px;border-radius:8px;font-size:15px;margin-bottom:14px;border-top:1px solid var(--card-border);border-right:1px solid var(--card-border);border-bottom:1px solid var(--card-border)}

canvas{width:100%;max-width:440px;aspect-ratio:360/220;border-radius:8px;border:2px solid var(--card-border);display:block;margin:0 auto;background:#05070a}

.cmd{display:flex;gap:8px;align-items:center;margin-top:12px;background:#05070a;border:1.5px solid var(--card-border);border-radius:8px;padding:6px 8px 6px 12px;color:var(--cad-green)}
.cmd input{flex:1;background:transparent;border:0;color:#fff;outline:0;text-transform:uppercase;font-size:16px;padding:6px 4px}
.cmd input.bad{animation:sk .4s;color:#ff8a94}
.cmd input.okk{color:var(--cad-green)}
.stageChoice{width:100%;min-height:44px;white-space:normal;line-height:1.35;border:1px solid var(--card-border);border-radius:8px;padding:10px 12px}
.stageChoice:hover{border-color:var(--cad-cyan);background:rgba(0,240,255,.07)}
.stageChoice:active{transform:scale(.99)}
#stepArea .fb-card{margin-top:10px}
#stepArea .cmd{border-color:rgba(0,240,255,.35)}
#stepArea .cmd input{text-transform:none;min-width:60px}
.stage-unit{font-weight:700;color:var(--cad-yellow);padding:0 4px}

.fb{margin:12px 0 0;font-size:14px;min-height:24px}
.fb-card{
  padding:12px 14px;
  border-radius:8px;
  border-left:4px solid var(--cad-cyan);
  background:#111722;
  animation:fadeSlide .28s ease;
  line-height:1.45;
}
.fb-card.ok{border-left-color:var(--cad-green);background:rgba(15,56,34,0.75);color:#d7ffe8}
.fb-card.bad{border-left-color:var(--acc);background:rgba(61,20,24,0.8);color:#ffd6da}
.fb-card.hint{border-left-color:var(--cad-yellow);background:rgba(255,209,102,0.1);color:#ffe9b3}
@keyframes fadeSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.attempt-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  padding:3px 10px;
  border-radius:99px;
  background:#111722;
  border:1px solid var(--card-border);
  color:var(--cad-yellow);
  margin-bottom:10px;
}

.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
.cd{display:flex;gap:12px;border:1px solid var(--card-border);border-radius:8px;padding:12px;background:#111722}
.cd svg{width:36px;height:36px;color:var(--cad-cyan);flex:none}
.cd p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.al{background:var(--acc);color:#fff;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700}

.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:16px 0}
.big div{text-align:center;border:1px solid var(--card-border);border-radius:8px;padding:12px 8px;background:#111722}
.big b{display:block;font-size:20px;color:var(--cad-cyan)}

.stars{font-size:32px;letter-spacing:4px}

.mc{display:grid;gap:8px;margin:12px 0}
.mc div{border:1px solid var(--card-border);border-left:4px solid var(--cad-cyan);border-radius:6px;padding:10px 14px;background:#111722}
.mc small{display:block;color:var(--mut);font-size:13px;margin-top:2px}

.q ol{margin:.5em 0;padding-left:1.5em}.q li{margin:4px 0}.m.op{font-size:14px;align-items:flex-start}.m.op b{color:var(--cad-cyan)}

h3{margin:16px 0 8px;font-size:15px;color:var(--cad-cyan)}

.sync-badge{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--okbg);color:var(--cad-green);border:1px solid var(--cad-green);display:inline-flex;align-items:center;gap:4px}
.status-pill{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700;white-space:nowrap}
.status-active{background:rgba(255,209,102,.15);color:var(--cad-yellow);border:1px solid var(--cad-yellow)}
.status-done{background:var(--okbg);color:var(--cad-green);border:1px solid var(--cad-green)}

.admin-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.admin-table th, .admin-table td{border:1px solid var(--card-border);padding:10px 8px;text-align:left}
.admin-table th{background:#111722;color:var(--cad-cyan)}
.an-row{margin:10px 0;font-size:13px;text-align:left}
.an-row .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.an-row small{color:var(--mut)}
.ab{height:8px;background:#111722;border:1px solid var(--card-border);border-radius:4px;overflow:hidden;margin-top:4px}
.ab i{display:block;height:100%;background:var(--cad-green)}
.ab.warn i{background:var(--acc)}

.podium-box{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin:12px 0;text-align:center}
.podium-card{background:#111722;border:1px solid var(--card-border);border-top:3px solid var(--cad-cyan);border-radius:6px;padding:12px;font-size:13px}
.podium-card b{display:block;font-size:15px;color:var(--cad-yellow);margin-bottom:4px}

/* RESPONSIVE MOBILE LAYOUT */
@media(max-width:600px){
  header{padding:8px 12px; gap:6px}
  .logo{font-size:16px}
  .hud{width:100%; justify-content:space-between; font-size:12px}
  .hud span{padding:3px 7px}
  main{padding:12px 10px 28px}
  .panel{padding:16px 14px; border-radius:10px}
  .mg{grid-template-columns:1fr 1.35fr; gap:8px}
  .m{padding:10px 10px; min-height:50px; font-size:13px; gap:8px}
  .m.l svg{width:30px; height:30px}
  .row{flex-direction:column; width:100%}
  .row .btn{width:100%}
  .cmd{flex-wrap:wrap; padding:8px}
  .cmd input{width:100%; min-width:140px}
  .cmd .btn{width:100%}
  .podium-box{grid-template-columns:1fr}
  .steps{gap:4px; font-size:11px}
  .steps span{padding:4px 8px; flex:1; text-align:center}
  .q{padding:12px; font-size:14px}
}
</style>
</head>
<body>
<header id="mainHeader" class="hidden-header">
  <div class="logo">
    <div class="logo-icon">📐</div>
    <div>CAD<b>MISSION</b></div>
  </div>
  <div class="hud">
    <span class="sync-badge" id="syncStatus">🟡 Lokal / Offline</span>
    <span id="pnBox" style="display:none;max-width:170px;overflow:hidden;text-overflow:ellipsis">👤 <b id="pn"></b></span>
<span id="pnBox" style="display:none;max-width:170px;overflow:hidden;text-overflow:ellipsis">👤 <b id="pn"></b></span>
<span>⭐ <b id="sc">0</b></span>
    <span>🔥 <b id="st">0</b></span>
    <span>⏱ <b id="tm" class="mono">00:00</b></span>
    <button id="sn" title="Suara">🔊</button>
    <button id="exitBtn" title="Keluar ke lobi" style="display:none">⏏ Keluar</button>
  </div>
</header>
<main id="app"></main>

<script>

// =========================================================================

  storageBucket: "cadmission-eb6f0.firebasestorage.app",
  messagingSenderId: "273134645732",
  appId: "1:273134645732:web:61e29ac22cc64ec6e597f1",
  measurementId: "G-YYECPHLFY5"
};

// =========================================================================
// 2. SISTEM SINKRONISASI REAL-TIME (UPSERT BERDASARKAN SESSION ID SISWA)

const STORAGE_KEY = 'cad_mission_results_v2';

// Modul Firebase dimuat belakangan (type="module"), jadi semua sinkronisasi menunggu sinyal ini.
window._fbActive = false;
window._fbReady = new Promise(res => { window._fbResolve = res; });
const _waitFirebase = () => Promise.race([window._fbReady, new Promise(r => setTimeout(r, 5000))]);

function getLocalResults() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch (e) {
    return [];
  }
}

function upsertLocalResult(sessionId, data) {
  const list = getLocalResults();
  const idx = list.findIndex(item => item.sessionId === sessionId);
  const record = {
    ...data,
    sessionId,
    updatedAt: new Date().toISOString()
  };
  if (idx !== -1) {
    list[idx] = { ...list[idx], ...record };
  } else {
    list.push(record);
  }
  list.sort((a, b) => (b.skor - a.skor) || (a.durasiDetik - b.durasiDetik));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  window.dispatchEvent(new Event('cad_results_updated'));
}

window.syncStudentSession = async function(sessionId, gameData, callback) {
  upsertLocalResult(sessionId, gameData);
  await _waitFirebase();
  if (window._firebaseUpsert) {
    await window._firebaseUpsert(sessionId, gameData);
  }
  if (callback) callback();
};

window.clearAllResults = async function() {
  localStorage.removeItem(STORAGE_KEY);
  window.dispatchEvent(new Event('cad_results_updated'));
  if (window._firebaseClearAll) {
    await window._firebaseClearAll();
  }
};

let _activeLocal = null, _activeRemoteUnsub = null, _listenToken = 0;
window.listenToStudentResults = function(callback) {
  const token = ++_listenToken;
  if (_activeLocal) {
    window.removeEventListener('storage', _activeLocal);
    window.removeEventListener('cad_results_updated', _activeLocal);
    _activeLocal = null;
  }
  if (_activeRemoteUnsub) {
    try { _activeRemoteUnsub(); } catch (e) {}
    _activeRemoteUnsub = null;
  }

  callback(getLocalResults());

  const onLocal = (e) => {
    if (window._fbActive) return; // saat cloud aktif, data cloud yang dipakai
    if (!e || e.key === STORAGE_KEY || e.type === 'cad_results_updated') {
      callback(getLocalResults());
    }
  };
  _activeLocal = onLocal;
  window.addEventListener('storage', onLocal);
  window.addEventListener('cad_results_updated', onLocal);

  window._fbReady.then(() => {
    if (token !== _listenToken) return; // sudah ada listener yang lebih baru
    if (window._firebaseListen) {
      _activeRemoteUnsub = window._firebaseListen(callback);
    }
  });
};
</script>

<!-- Modul Cloud Firestore (Aktif otomatis bila FIREBASE_CONFIG diisi & dibuka lewat HTTP/HTTPS) -->
<script type="module">
  const cfg = window.FIREBASE_CONFIG;
  if (cfg && cfg.apiKey && cfg.apiKey !== "API_KEY_ANDA" && location.protocol.startsWith("http")) {
    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
      const { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, serverTimestamp, onSnapshot, query, orderBy } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
      const app = initializeApp(cfg);
      const db = getFirestore(app);

      const syncBadge = document.getElementById('syncStatus');
      if (syncBadge) {
        syncBadge.textContent = "🟢 Live Cloud Sync";
        syncBadge.style.borderColor = "var(--cad-green)";
        syncBadge.style.color = "var(--cad-green)";
      }

      window._fbActive = true;
      const badgeError = (msg) => {
        const b = document.getElementById('syncStatus');
        if (b) { b.textContent = msg; b.style.borderColor = "var(--acc)"; b.style.color = "var(--acc)"; }
      };

      window._firebaseUpsert = async function(sessionId, gameData) {
        try {
          await setDoc(doc(db, "cad_mission_results", sessionId), {
            ...gameData,
            sessionId,
            waktuKirim: serverTimestamp()
          }, { merge: true });
        } catch (err) {
          console.error("Gagal sinkronisasi ke Firestore:", err);
          badgeError("🔴 Gagal kirim (cek aturan Firestore)");
        }
      };

      window._firebaseClearAll = async function() {
        try {
          const snap = await getDocs(collection(db, "cad_mission_results"));
          const deletes = [];
          snap.forEach((d) => deletes.push(deleteDoc(doc(db, "cad_mission_results", d.id))));
          await Promise.all(deletes);
        } catch (err) {
          console.error("Gagal menghapus data Firestore:", err);
        }
      };

      window._firebaseListen = function(callback) {
        const q = query(collection(db, "cad_mission_results"), orderBy("skor", "desc"));
        return onSnapshot(q, (snapshot) => {
          const results = [];
          snapshot.forEach((d) => results.push({ id: d.id, ...d.data() }));
          callback(results);
        }, (err) => {
          console.error("Gagal membaca Firestore:", err);
          badgeError("🔴 Gagal baca (cek aturan Firestore)");
        });
      };
    } catch (e) {
      console.warn("Firebase tidak aktif, memakai penyimpanan lokal:", e);
      window._fbActive = false;
    }
  }
  window._fbResolve();
</script>

const PROG_KEY  = 'cad_mission_progress_v1';

function saveProgress(){
  if(!S) return;
  try{
    S.elapsed = (S.final != null) ? S.final : (Date.now() - S.t0);
    localStorage.setItem(PROG_KEY, JSON.stringify(S));
  }catch(e){}
}
function clearProgress(){
  try{ localStorage.removeItem(PROG_KEY); }catch(e){}
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(PROG_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || !d.sessionId || !d.name || !d.view || !d.view.type || !Array.isArray(d.st)){
      clearProgress();
      return null;
    }
    return d;
  }catch(e){
    clearProgress();
    return null;
  }
}

function beep(type){
  if(!snd)return;
  try{
    ac=ac||new AudioContext();
    const now=ac.currentTime;
    if(type==='ok'){
      [587.33, 880].forEach((freq,idx)=>{
        const o=ac.createOscillator(),g=ac.createGain();
        o.type='triangle';
        o.frequency.setValueAtTime(freq, now+idx*0.08);
        g.gain.setValueAtTime(0.07, now+idx*0.08);
        g.gain.exponentialRampToValueAtTime(0.001, now+idx*0.08+0.18);
        o.connect(g);g.connect(ac.destination);
        o.start(now+idx*0.08);o.stop(now+idx*0.08+0.19);
      });
    } else if(type==='bad'){
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sawtooth';
      o.frequency.setValueAtTime(190, now);
      o.frequency.linearRampToValueAtTime(130, now+0.22);
      g.gain.setValueAtTime(0.06, now);
      g.gain.exponentialRampToValueAtTime(0.001, now+0.24);
      o.connect(g);g.connect(ac.destination);
      o.start(now);o.stop(now+0.25);
    } else {
      const o=ac.createOscillator(),g=ac.createGain();
      o.frequency.value=520;
      g.gain.value=0.03;
      o.connect(g);g.connect(ac.destination);
      o.start(now);o.stop(now+0.05);
    }
  }catch(e){}
}

function buildSyncPayload(isFinished = false) {
  if (!S) return null;
  const t = Math.floor(((S.final != null) ? S.final : (Date.now() - S.t0)) / 1000);
  const totalJawaban = S.right + S.wrong;
  const a = totalJawaban > 0 ? Math.round((S.right / totalJawaban) * 100) : 0;
  const rk = isFinished
    ? (a >= 90 ? 'Master Drafter' : a >= 70 ? 'Senior Drafter' : a >= 50 ? 'Junior Drafter' : 'Trainee Drafter')
    : (LB[(S.cur || 1) - 1] || 'Command Explorer');

  return {
    nama: S.name,
    skor: S.score,
    akurasi: a,
    pangkat: rk,
    status: isFinished ? 'Selesai' : 'Sedang Bermain',
    misiAktif: isFinished ? 'Semua Misi Selesai' : (LB[(S.cur || 1) - 1] || 'Command Explorer'),
    durasiDetik: t,
    misi: {
      m1: { benar: (S.st[0]||[0,0])[0], salah: (S.st[0]||[0,0])[1] },
      m2: { benar: (S.st[1]||[0,0])[0], salah: (S.st[1]||[0,0])[1] },
      m3: { benar: (S.st[2]||[0,0])[0], salah: (S.st[2]||[0,0])[1] }
    },
    topik: S.tp || {}
  };
}

function pts(ok,v,topic){
  if(ok){S.right++;S.streak++;S.score+=v*(S.streak>=3?2:1)}
  else{S.wrong++;S.streak=0;S.score=Math.max(0,S.score-20)}
  S.st[S.cur-1][ok?0:1]++;
  if(topic){ S.tp=S.tp||{}; const tt=S.tp[topic]=S.tp[topic]||{b:0,s:0}; ok?tt.b++:tt.s++; }
  hud();
  if (S && S.sessionId) {
    window.syncStudentSession(S.sessionId, buildSyncPayload(false));
  }
  saveProgress();
}

function matchRound(o,rs){
  let sel=null,d=0;
  const n=o.items.length;
  stage(o.lv);
  app.innerHTML=`<section class="panel">${steps(o.lv)}<h2>${o.t}</h2><p class="mut">${o.s}</p><div class="mg"><div class="col">${sh(o.items).map(c=>`<div class="m l" draggable="true" data-k="${c.n}">${o.l(c)}</div>`).join('')}</div><div class="col">${sh(o.items).map(c=>`<div class="m r" data-k="${c.n}">${o.r(c)}</div>`).join('')}</div></div><div class="prog"><i id="pb"></i></div></section>`;
  const q=(k,s)=>app.querySelector(`.${s}[data-k="${k}"]`);
  function tryM(a,b){
    if(a==b){
      ['l','r'].forEach(s=>{const e=q(a,s);e.classList.remove('sel');e.classList.add('ok')});
      sel=null;pts(1,100,a);beep('ok');flashPanel('ok');
      S.view.matched.push(a);saveProgress();
      $('#pb').style.width=(++d/n*100)+'%';
      if(d==n)setTimeout(()=>{ if(S) o.next(); },700);
    } else {
      const e=q(b,'r');
      e.classList.add('bad');
      setTimeout(()=>e.classList.remove('bad'),500);
      pts(0,0,a);beep('bad');flashPanel('bad');
    }
  }
  // pulihkan pasangan yang sudah benar bila halaman dimuat ulang
  const done = (rs && Array.isArray(rs.matched)) ? rs.matched.filter(k=>o.items.some(c=>c.n===k)) : [];
  setView({type:'match',round:o.round,matched:done.slice()});
  done.forEach(k=>['l','r'].forEach(s=>{const e=q(k,s);if(e){e.classList.remove('sel');e.classList.add('ok')}}));
  d=done.length;
  $('#pb').style.width=(d/n*100)+'%';
  if(d>=n){ setTimeout(()=>{ if(S) o.next(); },300); return; }

  app.querySelectorAll('.l').forEach(e=>{
    e.onclick=()=>{beep('click');app.querySelectorAll('.l.sel').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');sel=e.dataset.k};
    e.ondragstart=ev=>{ev.dataTransfer.setData('text/plain',e.dataset.k);sel=e.dataset.k};
  });
  app.querySelectorAll('.r').forEach(e=>{
    e.onclick=()=>{if(sel)tryM(sel,e.dataset.k)};
    e.ondragover=ev=>ev.preventDefault();
    e.ondrop=ev=>{ev.preventDefault();const k=ev.dataTransfer.getData('text/plain');if(k)tryM(k,e.dataset.k)};
  });
}

function scene(cv,n,t){
  const c=cv.getContext('2d'),W=360,H=220;
  c.setTransform(1,0,0,1,0,0);
  c.globalAlpha=1;
  c.setLineDash([]);
  c.fillStyle='#05070a';
  c.fillRect(0,0,W,H);
  
  c.strokeStyle='rgba(0, 240, 255, 0.08)';
  c.lineWidth=1;
  for(let x=0;x<W;x+=20){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}
  for(let y=0;y<H;y+=20){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
 
  c.lineWidth=2.5;
  c.strokeStyle='#00f0ff';
  const L=(a,b,d,e)=>{c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.stroke()};
  if(n=='TRIM'){L(180,30,180,190);L(60,110,180,110);c.globalAlpha=1-t;c.strokeStyle='#ff4d5e';L(180,110,300,110)}
  if(n=='EXTEND'){L(290,30,290,190);L(60,110,180,110);c.strokeStyle='#ffd166';L(180,110,180+110*t,110)}
  if(n=='OFFSET'){L(60,170,280,80);c.translate(-15*t,-37*t);c.strokeStyle='#ffd166';L(60,170,280,80)}
  if(n=='FILLET'){const r=50*t;c.beginPath();c.moveTo(120,40);c.lineTo(120,160-r);c.arcTo(120,160,120+r,160,r);c.lineTo(300,160);c.stroke()}
  if(n=='STRETCH'){c.strokeRect(60,70,120+110*t,80);c.setLineDash([6,4]);c.strokeStyle='#00e676';c.globalAlpha=1-.6*t;c.strokeRect(150,52,90,116)}
  c.globalAlpha=1
}
function anim(cv,n){let s=null;const f=ts=>{s=s||ts;const t=Math.min(1,(ts-s)/1000);scene(cv,n,t);if(t<1)requestAnimationFrame(f)};requestAnimationFrame(f)}

function typed(items,next,rs){
  const Q=(rs && Array.isArray(rs.order)) ? rs.order.map(nm=>items.find(c=>c.n===nm)).filter(Boolean) : sh(items);
  let i=(rs && Q.length) ? Math.min(rs.i||0, Q.length-1) : 0;
  let rq=rs||null;
  stage(1);

  const taskFor = n => ({
    OFFSET:{instruction:'Buat garis sejajar ke arah atas dengan jarak <b>15 cm</b> dari garis yang telah tersedia.',stages:[
      {type:'input',prompt:'Specify offset distance:',label:'Tahap 1: Masukkan jarak offset',unit:'cm',answer:'15'},
      {type:'canvas',prompt:'Select object to offset:',label:'Tahap 2: Select garis yang akan di-offset',target:'offset-line'},
      {type:'canvas',prompt:'Specify point on side to offset:',label:'Tahap 3: Pilih sisi atas tempat garis sejajar dibuat',target:'offset-up'}]},
    FILLET:{instruction:'Bulatkan sudut pertemuan dua garis dengan radius <b>5 cm</b>.',stages:[
      {type:'input',prompt:'Enter option:',label:'Tahap 1: Ketik R (Radius)',answer:'R',placeholder:'Ketik R'},
      {type:'input',prompt:'Specify fillet radius:',label:'Tahap 2: Masukkan radius',unit:'cm',answer:'5'},
      {type:'canvas',prompt:'Select first object:',label:'Tahap 3: Select garis pertama',target:'fillet-first'},
      {type:'canvas',prompt:'Select second object:',label:'Tahap 4: Select garis kedua yang akan dibulatkan',target:'fillet-second'}]},
    STRETCH:{instruction:'Perpanjang objek tersebut ke sebelah kanan sejauh <b>70 cm</b> sesuai arah yang ditentukan.',stages:[
      {type:'canvas',prompt:'Select objects to stretch:',label:'Tahap 1: Select bagian objek yang akan diperpanjang',target:'stretch-object'},
      {type:'input',prompt:'Specify stretch displacement:',label:'Tahap 2: Masukkan jarak peregangan',unit:'cm',answer:'70'},
      {type:'canvas',prompt:'Specify direction:',label:'Tahap 3: Tentukan arah peregangan',target:'stretch-right'}]},
    TRIM:{instruction:'Hilangkan bagian garis horizontal yang melewati batas garis vertikal.',stages:[
      {type:'canvas',prompt:'Select cutting edge:',label:'Tahap 1: Select garis sebagai batas pemotong',target:'trim-boundary'},
      {type:'enter',prompt:'Select cutting edges: Enter to continue',label:'Tahap 2: Klik Enter untuk melanjutkan',answer:'ENTER'},
      {type:'canvas',prompt:'Select segment to trim:',label:'Tahap 3: Select bagian garis yang harus dihilangkan',target:'trim-segment'}]},
    EXTEND:{instruction:'Hubungkan garis horizontal yang terputus hingga mencapai batas garis vertikal.',stages:[
      {type:'canvas',prompt:'Select boundary edge:',label:'Tahap 1: Select garis sebagai batas perpanjangan',target:'extend-boundary'},
      {type:'enter',prompt:'Select boundary edges: Enter to continue',label:'Tahap 2: Klik Enter untuk melanjutkan',answer:'ENTER'},
      {type:'canvas',prompt:'Select object to extend:',label:'Tahap 3: Select garis yang akan diperpanjang',target:'extend-segment'}]}
  }[n] || {instruction:'Gunakan command yang sesuai dengan fungsi perintah.',stages:[]});

  function show(){
    const c=Q[i], task=taskFor(c.n);
    let fails=0, fin=0, hintedThisQ=0, res=null, step=0, stepErrors=0, commandDone=0, filletFirst=null;
    const rsq=rq; rq=null;
    if(rsq){ fails=rsq.fails||0; fin=rsq.fin?1:0; hintedThisQ=rsq.hinted?1:0; res=rsq.res||null; step=rsq.step||0; stepErrors=rsq.stepErrors||0; commandDone=rsq.commandDone?1:0; filletFirst=rsq.filletFirst||null; }
    const order=Q.map(x=>x.n);
    const saveView=()=>setView({type:'typed',order,i,fails,fin,hinted:hintedThisQ,res,step,stepErrors,commandDone,filletFirst});

    app.innerHTML=`<section class="panel">${steps(1)}
      <h2>Command Explorer (3/3)</h2>
      <div class="attempt-badge" id="attBadge">🎯 Kesempatan: ${Math.max(0,2-fails)} tersisa · 💡 Sisa Bantuan: ${S.hintsLeft}</div>
      <p class="mut">Soal ${i+1} dari ${Q.length} – ketik command, tekan Enter, lalu ikuti prompt dan masukkan parameter atau pilih objek sesuai prosedur.</p>
      <div class="q">${task.instruction}</div>
      <canvas id="cv" width="360" height="220"></canvas>
      <div class="cmd"><span class="mono">Command:</span><input id="in" class="mono" autocomplete="off" spellcheck="false" placeholder="Ketik perintah (mis. ${c.n})"><button type="button" class="btn" id="en">Enter</button></div>
      <div id="stepArea"></div>
      <div class="fb" id="fb"></div>
      <div class="row" id="actionRow"><button class="btn ghost" id="hn" ${S.hintsLeft<=0?'disabled':''}>💡 Gunakan Bantuan (−30) [${S.hintsLeft}/2]</button></div>
    </section>`;

    const cv=$('#cv'), inp=$('#in'), fb=$('#fb'), hnBtn=$('#hn'), attBadge=$('#attBadge'), actionRow=$('#actionRow'), stepArea=$('#stepArea');
    scene(cv,c.n,0);
    inp.focus();
    let stageInput=null;

    const updateBadge=()=>{attBadge.innerHTML=`🎯 Kesempatan: ${Math.max(0,2-fails)} tersisa · 💡 Sisa Bantuan: ${S.hintsLeft}`;};
    const showNextButton=()=>{
      actionRow.innerHTML=`<button class="btn" id="nx">${i==Q.length-1?'Lanjut ke Choose Your Step':'Soal Berikutnya'} →</button>`;
      $('#nx').onclick=()=>{beep('click');morphNavigate(()=>{i++;i==Q.length?next():show();});};
    };
    const useHint=()=>{
      if(fin||hintedThisQ||S.hintsLeft<=0)return;
      hintedThisQ=1;S.hintsLeft--;S.score=Math.max(0,S.score-30);hud();
      if(S&&S.sessionId)window.syncStudentSession(S.sessionId,buildSyncPayload(false));
      saveView();beep('click');hnBtn.disabled=true;hnBtn.textContent=`💡 Bantuan Terpakai [${S.hintsLeft}/2]`;updateBadge();
      fb.innerHTML=`<div class="fb-card hint">💡 <b>Petunjuk:</b> Perintah diawali huruf <b class="mono">${c.n[0]}</b> (${c.n.length} huruf), dan alias-nya diawali <b class="mono">${c.a[0]}</b>.</div>`;
      inp.focus();
    };
    const complete=()=>{
      fin=1;res='ok';
      const earned=(fails===0&&stepErrors===0)?150:75;
      pts(1,earned,c.n);saveView();beep('ok');flashPanel('ok');
      fb.innerHTML=`<div class="fb-card ok">✔ <b>Berhasil!</b> Kamu menyelesaikan command <b class="mono">${c.n}</b> beserta tahapan input dan pemilihan objek dengan tepat. ${fails||stepErrors?`Skor penyelesaian: <b>${earned}</b> (ada percobaan yang perlu diperbaiki).`:`Skor: <b>${earned}</b>.`}</div>`;
      scene(cv,c.n,1);showNextButton();
    };
    const renderStage=()=>{
      if(fin||!commandDone)return;
      if(step>=task.stages.length){complete();return;}
      const st=task.stages[step];
      stepArea.innerHTML=`<div class="fb-card hint"><b>${st.label}</b></div>`+
        (st.type==='input'?`<div class="cmd" style="margin-top:8px"><span class="mono">Input:</span><input id="stageInput" class="mono" autocomplete="off" placeholder="${st.placeholder||'Masukkan nilai'}" ${st.unit?`inputmode="decimal"`:''}><span class="mono stage-unit">${st.unit||''}</span><button type="button" class="btn" id="stageEnter">Enter</button></div>`:
        st.type==='enter'?`<div class="cmd" style="margin-top:8px;justify-content:flex-start"><button type="button" class="btn" id="stageEnter">↵ Enter</button></div>`:
        `<div class="fb-card hint">Klik langsung garis/objek pada gambar di atas untuk memilih. ${st.target==='offset-up'?'Klik area di atas garis untuk menentukan sisi offset.':st.target==='stretch-right'?'Klik area gambar untuk menentukan arah peregangan.':''}</div>`);
      if(st.type==='input'){
        stageInput=$('#stageInput');stageInput.focus();
        const check=()=>{
          const val=stageInput.value.trim().toUpperCase();if(!val)return;
          if(val===String(st.answer).toUpperCase()){
            beep('ok');fb.innerHTML=`<div class="fb-card ok">✔ Input benar. Lanjutkan ke tahap berikutnya.</div>`;step++;saveView();renderStage();
          }else{
            stepErrors++;saveView();beep('bad');flashPanel('bad');stageInput.value='';stageInput.focus();
            fb.innerHTML=`<div class="fb-card bad">✖ Input belum tepat. Periksa kembali parameter yang diminta.</div>`;
          }
        };
        const stageEnterBtn=$('#stageEnter');
        stageEnterBtn.addEventListener('click',e=>{e.preventDefault();check();});
        stageInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check();}});
      }else if(st.type==='enter'){
        const stageEnterBtn=$('#stageEnter');
        stageEnterBtn.addEventListener('click',e=>{e.preventDefault();beep('click');step++;saveView();renderStage();});
      }
    };
    const canvasPick=(ev)=>{
      if(fin||!commandDone||step>=task.stages.length)return;
      const st=task.stages[step];if(st.type!=='canvas')return;
      const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)*cv.width/r.width,y=(ev.clientY-r.top)*cv.height/r.height;
      const near=(a,b,t=18)=>Math.abs(a-b)<=t;
      let ok=false;
      if(c.n==='OFFSET'&&st.target==='offset-line') ok=near(y,110,24)&&x>45&&x<315;
      else if(c.n==='OFFSET'&&st.target==='offset-up') ok=y<90&&x>40&&x<320;
      else if(c.n==='FILLET'&&st.target==='fillet-first') ok=(near(x,120,22)&&y>35&&y<180)||(near(y,160,22)&&x>120&&x<320);
      else if(c.n==='FILLET'&&st.target==='fillet-second') ok=filletFirst==='vertical' ? (near(y,160,22)&&x>120&&x<320) : filletFirst==='horizontal' ? (near(x,120,22)&&y>35&&y<180) : false;
      else if(c.n==='STRETCH'&&st.target==='stretch-object') ok=x>145&&x<205&&y>65&&y<155;
      else if(c.n==='STRETCH'&&st.target==='stretch-right') ok=x>220&&y>65&&y<155;
      else if(c.n==='TRIM'&&st.target==='trim-boundary') ok=near(x,180,24)&&y>35&&y<185;
      else if(c.n==='TRIM'&&st.target==='trim-segment') ok=x>180&&x<315&&near(y,110,22);
      else if(c.n==='EXTEND'&&st.target==='extend-boundary') ok=near(x,290,24)&&y>35&&y<185;
      else if(c.n==='EXTEND'&&st.target==='extend-segment') ok=x>50&&x<285&&near(y,110,22);
      if(ok){
        // FILLET accepts either line order; first selection is remembered visually/state-wise.
        if(c.n==='FILLET'&&st.target==='fillet-first'){filletFirst=near(x,120,22)?'vertical':'horizontal';step++;saveView();fb.innerHTML='<div class="fb-card ok">✔ Garis pertama terpilih. Sekarang pilih garis lainnya.</div>';renderStage();return;}
        beep('ok');fb.innerHTML=`<div class="fb-card ok">✔ Objek/posisi tepat. Lanjutkan.</div>`;step++;saveView();renderStage();
      }else{stepErrors++;saveView();beep('bad');flashPanel('bad');fb.innerHTML='<div class="fb-card bad">✖ Klik objek atau posisi yang sesuai dengan instruksi pada gambar.</div>';}
    };
    cv.onclick=canvasPick;

    const go=()=>{
      if(fin||commandDone)return;
      const v=inp.value.trim().toUpperCase();if(!v)return;
      if(v===c.n||v===c.a||(c.x||[]).includes(v)){
        commandDone=1;saveView();beep('ok');flashPanel('ok');inp.disabled=true;$('#en').disabled=true;inp.classList.add('okk');
        fb.innerHTML=`<div class="fb-card ok">✔ Command <b class="mono">${c.n}</b> benar. Sekarang ikuti prompt berikutnya seperti pada penggunaan AutoCAD.</div>`;
        renderStage();
      }else{
        pts(0,0,c.n);fails++;saveView();beep('bad');flashPanel('bad');updateBadge();inp.classList.add('bad');setTimeout(()=>inp.classList.remove('bad'),450);
        if(fails===1){inp.value='';inp.focus();fb.innerHTML=`<div class="fb-card bad">✖ Command belum tepat. Periksa kembali nama perintah atau alias-nya. Kamu masih memiliki <b>1 kesempatan</b>.</div>`;}
        else{fin=1;res='fail';saveView();inp.disabled=true;$('#en').disabled=true;fb.innerHTML=`<div class="fb-card bad">✖ <b>Kesempatan mengetik command habis!</b> Command yang benar adalah <b class="mono">${c.n}</b>. Kamu dapat melanjutkan soal berikutnya.</div>`;scene(cv,c.n,1);showNextButton();}
      }
    };
    hnBtn.onclick=useHint;
    const commandEnter=$('#en');
    commandEnter.addEventListener('click',e=>{e.preventDefault();go();});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    saveView();
    if(rsq){
      if(hintedThisQ){hnBtn.disabled=true;hnBtn.textContent=`💡 Bantuan Terpakai [${S.hintsLeft}/2]`;fb.innerHTML=`<div class="fb-card hint">💡 <b>Petunjuk:</b> Perintah diawali huruf <b class="mono">${c.n[0]}</b> (${c.n.length} huruf), dan alias-nya diawali <b class="mono">${c.a[0]}</b>.</div>`;}
      updateBadge();
      if(fin){inp.disabled=true;$('#en').disabled=true;if(res==='ok'){inp.value=c.n;inp.classList.add('okk');scene(cv,c.n,1);showNextButton();}else showNextButton();}
      else if(commandDone){inp.value=c.n;inp.disabled=true;$('#en').disabled=true;renderStage();}
    }
  }
  show();
}

function quiz(n,Q,sub,next,rs){
  let i=rs ? Math.min(rs.i||0, Q.length-1) : 0;
  let rq=rs||null;
  stage(n);

  function show(){
    const q=Q[i];
    let tries=0, fin=0, selectedIdx=null, bad=[], res=null;
    const rsq=rq; rq=null;
    if(rsq){ tries=rsq.tries||0; fin=rsq.fin?1:0; bad=(rsq.bad||[]).slice(); res=rsq.res||null; }
    const saveView=()=>setView({type:'quiz',n,i,tries,fin,bad:bad.slice(),res});

    app.innerHTML=`<section class="panel">${steps(n)}
      <h2>${n==2?'Choose Your Step':'Drawing Master'}</h2>
      <div class="attempt-badge" id="qAttBadge">🎯 Kesempatan: 2 tersisa</div>
      <p class="mut">Soal ${i+1} dari ${Q.length} – ${sub}</p>
      <div class="q">${q.p}${q.l?'<ol>'+q.l.map((x,j)=>`<li value="${j+1}">${x}</li>`).join('')+'</ol>':''}<br><b>${q.z}</b></div>
      <div class="col">${q.o.map((t,j)=>`<div class="m op" data-j="${j}"><b>${'ABCD'[j]}.</b><span>${t}</span></div>`).join('')}</div>
      <div class="fb" id="fb"></div>
      <div class="row" id="quizActionRow">
        <button class="btn confirm-btn" id="verifyBtn" disabled>✔ Pilih Jawaban</button>
      </div>
      <div class="prog"><i style="width:${i/Q.length*100}%"></i></div>
    </section>`;

    const fb = h => $('#fb').innerHTML = h;
    const verifyBtn = $('#verifyBtn');
    const qAttBadge = $('#qAttBadge');
    const quizActionRow = $('#quizActionRow');

    const showNextQuizBtn = () => {
      quizActionRow.innerHTML = `<button class="btn" id="nx">${i==Q.length-1?'Selesai & Lihat Hasil':'Soal Berikutnya'} →</button>`;
      $('#nx').onclick = () => {
        beep('click');
        morphNavigate(() => {
          i++;
          i == Q.length ? next() : show();
        });
      };
    };

    app.querySelectorAll('.op').forEach(e => {
      e.onclick = () => {
        if(fin || e.classList.contains('bad')) return;
        beep('click');
        app.querySelectorAll('.op').forEach(x => x.classList.remove('sel'));
        e.classList.add('sel');
        selectedIdx = +e.dataset.j;
        verifyBtn.disabled = false;
      };
    });

    verifyBtn.onclick = () => {
      if(fin || selectedIdx === null) return;
      const chosenEl = app.querySelector(`.op[data-j="${selectedIdx}"]`);
      chosenEl.classList.remove('sel');

      if(selectedIdx === q.k){
        fin = 1;
        chosenEl.classList.add('ok');
        const earned = tries === 0 ? 100 : 50;
        pts(1, earned, 'M'+n+'-'+(i+1));
        res = 'ok';
        saveView();
        beep('ok');
        flashPanel('ok');
        fb(`<div class="fb-card ok">🎉 <b>Jawaban Tepat! (+${earned} Poin)</b><br>${q.e}</div>`);
      } else {
        chosenEl.classList.add('bad');
        chosenEl.style.pointerEvents = 'none';
        pts(0, 0, 'M'+n+'-'+(i+1));
        beep('bad');
        flashPanel('bad');
        tries++;
        bad.push(+chosenEl.dataset.j);
        saveView();
        selectedIdx = null;
        verifyBtn.disabled = true;

        const rem = Math.max(0, 2 - tries);
        qAttBadge.innerHTML = `🎯 Kesempatan: ${rem} tersisa`;

        if(tries >= 2){
          fin = 1;
          res = 'fail';
          saveView();
          app.querySelector(`.op[data-j="${q.k}"]`).classList.add('ok');
          fb(`<div class="fb-card bad">✖ <b>Kesempatan habis!</b> Jawaban yang tepat adalah <b>${'ABCD'[q.k]}</b>.<br>${q.e}</div>`);
        } else {
          fb(`<div class="fb-card bad">⚠ <b>Pilihan belum tepat!</b> Silakan pilih opsi lain, lalu klik <b>“Pilih Jawaban”</b> lagi (sisa 1 kesempatan).</div>`);
        }
      }

      if(fin){
        app.querySelectorAll('.op').forEach(x => x.style.pointerEvents = 'none');
        showNextQuizBtn();
      }
    };

    saveView();
    // pulihkan keadaan soal ini bila halaman dimuat ulang
    if(rsq){
      bad.forEach(j => {
        const el = app.querySelector(`.op[data-j="${j}"]`);
        if(el){ el.classList.add('bad'); el.style.pointerEvents = 'none'; }
      });
      qAttBadge.innerHTML = `🎯 Kesempatan: ${Math.max(0, 2 - tries)} tersisa`;
      if(fin){
        app.querySelectorAll('.op').forEach(x => x.style.pointerEvents = 'none');
        app.querySelector(`.op[data-j="${q.k}"]`).classList.add('ok');
        if(res === 'ok'){
          const earned = tries === 0 ? 100 : 50;
          fb(`<div class="fb-card ok">🎉 <b>Jawaban Tepat! (+${earned} Poin)</b><br>${q.e}</div>`);
        } else {
          fb(`<div class="fb-card bad">✖ <b>Kesempatan habis!</b> Jawaban yang tepat adalah <b>${'ABCD'[q.k]}</b>.<br>${q.e}</div>`);
        }
        showNextQuizBtn();
      } else if(tries >= 1){
        fb(`<div class="fb-card bad">⚠ <b>Pilihan belum tepat!</b> Silakan pilih opsi lain, lalu klik <b>“Pilih Jawaban”</b> lagi (sisa 1 kesempatan).</div>`);
      }
    }
  }
  show();
}

const QTOPIK = {
  2: ['CIRCLE','COPY','TRIM','OFFSET','MOVE'],
  3: ['OFFSET – garis sejajar salah sisi','LINE – celah antar garis','COPY – jarak salinan tidak konsisten','TRIM – merapikan sudut','COPY – strategi objek yang sama']
};
function topikLabel(key){
  const m = /^M([23])-(\d+)$/.exec(key);
  if(m){
    const nm = (QTOPIK[m[1]] || [])[+m[2]-1] || ('Soal ' + m[2]);
    return m[1] === '2' ? `Urutan langkah ${nm}` : `Kasus: ${nm}`;
  }
  const c = C.find(x => x.n === key);
  return c ? `${c.n} (${CAT_LB[c.g-1]})` : key;
}
function topikHint(key){
  const c = C.find(x => x.n === key);
  return c ? c.f : '';
}
const pctOf = (b,s) => (b+s) > 0 ? Math.round(b/(b+s)*100) : 0;

function personalBreakdownHTML(){
  const rows = LB.map((nm,i) => {
    const st = (S.st && S.st[i]) || [0,0];
    const t = st[0] + st[1];
    return `<tr><td>${nm}</td><td>${st[0]}</td><td>${st[1]}</td><td>${t ? pctOf(st[0],st[1]) + '%' : '-'}</td></tr>`;
  }).join('');
  const weak = Object.entries(S.tp || {})
    .filter(([k,v]) => v.s > 0)
    .sort((a,b) => (b[1].s - a[1].s) || (pctOf(a[1].b,a[1].s) - pctOf(b[1].b,b[1].s)))
    .slice(0,3);
  const weakHTML = weak.length
    ? '<ul style="margin:6px 0 0;padding-left:20px">' + weak.map(([k,v]) =>
        `<li><b>${topikLabel(k)}</b> – salah ${v.s}×${topikHint(k) ? `<br><small class="mut">${topikHint(k)}</small>` : ''}</li>`).join('') + '</ul>'
    : '<p class="mut">Hebat! Tidak ada materi yang salah.</p>';
  return `<div style="text-align:left">
    <h3>📊 Rincian per Misi</h3>
    <div style="overflow-x:auto"><table class="admin-table"><thead><tr><th>Misi</th><th>Benar</th><th>Salah</th><th>Akurasi</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h3>🔁 Materi yang Perlu Diulang</h3>${weakHTML}
  </div>`;
}

function perMisiCell(item){
  if(!item.misi) return '-';
  return ['m1','m2','m3'].map((k,i) => {
    const m = item.misi[k] || {};
    const b = m.benar || 0, sl = m.salah || 0;
    return `M${i+1} ${(b+sl) ? pctOf(b,sl) + '%' : '–'}`;
  }).join(' · ');
}

function classAnalysisHTML(data){
  const misi = [{b:0,s:0},{b:0,s:0},{b:0,s:0}];
  const topik = {};
  let n = 0;
  data.forEach(it => {
    if(!it.misi) return;
    n++;
    ['m1','m2','m3'].forEach((k,i) => {
      misi[i].b += (it.misi[k] && it.misi[k].benar) || 0;
      misi[i].s += (it.misi[k] && it.misi[k].salah) || 0;
    });
    Object.keys(it.topik || {}).forEach(k => {
      const t = it.topik[k] || {};
      topik[k] = topik[k] || {b:0,s:0};
      topik[k].b += t.b || 0;
      topik[k].s += t.s || 0;
    });
  });
  if(!n) return '<p class="mut">Belum ada data analisis. Data muncul setelah siswa menjawab soal.</p>';

  const misiHTML = misi.map((m,i) => {
    const p = pctOf(m.b, m.s);
    return `<div class="an-row"><div class="hd"><b>${LB[i]}</b><span>Akurasi ${(m.b+m.s) ? p + '%' : '–'} <small>(benar ${m.b} · salah ${m.s})</small></span></div><div class="ab ${p < 60 ? 'warn' : ''}"><i style="width:${p}%"></i></div></div>`;
  }).join('');

  const list = Object.entries(topik)
    .filter(([k,v]) => v.s > 0)
    .map(([k,v]) => ({k, b:v.b, s:v.s, rate: Math.round(v.s/(v.b+v.s)*100)}))
    .sort((a,b) => (b.rate - a.rate) || (b.s - a.s))
    .slice(0,8);
  const topikHTML = list.length
    ? list.map(x => `<div class="an-row"><div class="hd"><b>${topikLabel(x.k)}</b><span>${x.rate}% salah <small>(${x.s} dari ${x.b+x.s} percobaan)</small></span></div><div class="ab ${x.rate >= 50 ? 'warn' : ''}"><i style="width:${x.rate}%"></i></div></div>`).join('')
    : '<p class="mut">Belum ada jawaban salah yang tercatat.</p>';

  return `<h3>📊 Analisis per Misi <small class="mut">(${n} siswa)</small></h3>${misiHTML}
    <h3>⚠ Materi Paling Sering Salah</h3>
    <p class="mut">Persentase = jawaban salah ÷ seluruh percobaan pada materi itu. Semakin tinggi, semakin perlu dibahas ulang.</p>${topikHTML}`;
}
function result(){
  clearInterval(tm);
  if(S.final == null) S.final = Date.now() - S.t0;
  setView({type:'result'});
  { const fs = Math.floor(S.final/1000);
    $('#tm').textContent = String(Math.floor(fs/60)).padStart(2,'0')+':'+String(fs%60).padStart(2,'0'); }
  const finalPayload = buildSyncPayload(true);
  const st = finalPayload.akurasi >= 90 ? 3 : finalPayload.akurasi >= 70 ? 2 : finalPayload.akurasi >= 50 ? 1 : 0;
  beep('ok');

  app.innerHTML=`<section class="panel" style="text-align:center"><div class="stars">${'⭐'.repeat(st)||'🌱'}</div><h1>Misi Selesai!</h1>
 <p class="mut">${S.name}, pangkatmu: <b style="color:var(--cad-cyan)">${finalPayload.pangkat}</b></p>
 <p style="font-size:12px; color:var(--cad-green);">✨ Hasil akhir telah tersinkronisasi ke Dashboard Guru & Leaderboard.</p>
 
 <div class="big"><div><b>${S.score}</b>Skor Kamu</div><div id="myRankBox"><b>Memuat...</b>Peringkat Pribadi</div><div><b>${finalPayload.akurasi}%</b>Akurasi</div></div>
 ${personalBreakdownHTML()}
 <h3>🏆 Top 3 Drafter Terbaik (Global)</h3>
 <div id="podiumContainer" class="podium-box">
    <div class="podium-card"><b>#1</b><span>Memuat...</span></div>
    <div class="podium-card"><b>#2</b><span>Memuat...</span></div>
    <div class="podium-card"><b>#3</b><span>Memuat...</span></div>
 </div>

 <div class="row" style="justify-content:center; margin-top:20px;"><button class="btn" id="ag">↻ Main Lagi (Lobi)</button><button class="btn ghost" id="kd">📖 Kamus Perintah</button></div></section>`;

 $('#ag').onclick=()=>morphNavigate(home);
 $('#kd').onclick=()=>morphNavigate(()=>{
   $('#app').innerHTML=`<section class="panel"><h2>📖 Kamus Perintah</h2><p class="mut">Referensi ringkas perintah AutoCAD 2D dilengkapi konsep, contoh gambar teknik bangunan, dan ilustrasi skematis.</p>${cards()}<div class="row"><button class="btn" id="bk">← Kembali</button></div></section>`;
   $('#bk').onclick=()=>morphNavigate(result);
 });

  window.syncStudentSession(S.sessionId, finalPayload, () => {
    window.listenToStudentResults((data) => {
      const podium = document.getElementById('podiumContainer');
      const rankBox = document.getElementById('myRankBox');
      if(!podium || !rankBox) return;

      let myRankIndex = data.findIndex(item => item.sessionId === S.sessionId);
      let myRankText = myRankIndex !== -1 ? `#${myRankIndex + 1} dari ${data.length}` : `#1`;
      rankBox.innerHTML = `<b>${myRankText}</b>Peringkat Pribadi`;

      let podiumHTML = '';
      for(let i=0; i<3; i++) {
        if(data[i]) {
          podiumHTML += `<div class="podium-card"><b>#${i+1} ${data[i].nama}</b><span>${data[i].skor} Poin</span></div>`;
        } else {
          podiumHTML += `<div class="podium-card"><b>#${i+1}</b><span>Kosong</span></div>`;
        }
      }
      podium.innerHTML = podiumHTML;
    });
  });
}

function renderDeveloperDashboard() {
  app.innerHTML = `
    <section class="panel">
      <h2>👨‍💻 Dashboard Guru / Pengawas (Live Monitor)</h2>
      <p class="mut">Siswa yang baru masuk lobi maupun yang sedang mengerjakan soal langsung muncul di bawah ini secara real-time.</p>
      
      <div class="big">
        <div><b id="dashTotal">0</b>Total Siswa Masuk</div>
        <div><b id="dashActive">0</b>Sedang Bermain</div>
        <div><b id="dashAvgScore">0</b>Rata-rata Skor</div>
      </div>
      <div id="dashAnalisis"></div>

      <h3>👥 Data per Siswa</h3>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Nama Siswa</th>
              <th>Status</th>
              <th>Misi / Pangkat</th>
              <th>Skor</th>
              <th>Akurasi</th>
              <th>Per Misi</th>
            </tr>
          </thead>
          <tbody id="dashTableBody">
            <tr><td colspan="7" style="text-align:center;">Menunggu siswa masuk...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="row" style="margin-top:16px; justify-content:space-between;">
        <button class="btn ghost" id="dashBack">← Kembali ke Lobi</button>
        <button class="btn ghost" id="dashClear" style="border-color:var(--acc); color:var(--acc);">🗑 Reset Data Kelas</button>
      </div>
    </section>
  `;

  $('#dashBack').onclick = () => morphNavigate(home);
  $('#dashClear').onclick = async () => {
    if (confirm('Hapus seluruh data siswa dari Leaderboard & Dashboard?')) {
      await window.clearAllResults();
    }
  };

  window.listenToStudentResults((data) => {
    const tbody = $('#dashTableBody');
    if (!tbody) return;
    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Belum ada siswa yang masuk.</td></tr>`;
      $('#dashTotal').textContent = '0';
      $('#dashActive').textContent = '0';
      $('#dashAvgScore').textContent = '0';
      $('#dashAnalisis').innerHTML = '';
      return;
    }

    let totalScore = 0;
    let activeCount = 0;
    tbody.innerHTML = data.map((item, index) => {
      totalScore += item.skor || 0;
      const isDone = item.status === 'Selesai';
      if (!isDone) activeCount++;
      const badge = isDone
        ? `<span class="status-pill status-done">✔ Selesai</span>`
        : `<span class="status-pill status-active">⏳ Sedang Bermain</span>`;

      return `
        <tr>
          <td><b>#${index + 1}</b></td>
          <td><b>${item.nama}</b></td>
          <td>${badge}</td>
          <td>${isDone ? item.pangkat : (item.misiAktif || 'Command Explorer')}</td>
          <td><b style="color:var(--cad-cyan)">${item.skor}</b></td>
          <td>${item.akurasi}%</td>
          <td>${perMisiCell(item)}</td>
        </tr>
      `;
    }).join('');

    $('#dashTotal').textContent = data.length;
    $('#dashActive').textContent = activeCount;
    $('#dashAvgScore').textContent = Math.round(totalScore / data.length);
    $('#dashAnalisis').innerHTML = classAnalysisHTML(data);
  });
}

// Lanjutkan permainan dari posisi terakhir (setelah refresh / tutup tab / keluar web)
function resumeGame(d){
  S = d;
  S.t0 = Date.now() - (S.elapsed || 0);
  $('#mainHeader').classList.remove('hidden-header');
  hud();
  const v = S.view;

  if(v.type === 'result'){ result(); return; }

  clock();
  window.syncStudentSession(S.sessionId, buildSyncPayload(false));

  if(v.type === 'match')       { v.round === 2 ? P2(v) : P1(v); }
  else if(v.type === 'typed')  { typed(G(3), toM2Intro, v); }
  else if(v.type === 'intro')  { v.n === 2 ? intro(2, toM2Quiz) : intro(3, toM3Quiz); }
  else if(v.type === 'quiz')   { v.n === 2 ? quiz(2, M2, SUB2, toM3Intro, v) : quiz(3, M3, SUB3, result, v); }
  else throw new Error('view tidak dikenal: ' + v.type);
}

function boot(){
  const saved = loadProgress();
  if(saved){
    try{ resumeGame(saved); return; }
    catch(err){
      console.warn('Progres tersimpan tidak bisa dipulihkan, mulai dari awal:', err);
      clearInterval(tm); S = null; clearProgress();
    }
  }
  let entered = false;
  try{ entered = localStorage.getItem(ENTER_KEY) === '1'; }catch(e){}
  if(entered){
    $('#mainHeader').classList.remove('hidden-header');
    home();
  } else {
    showWelcomeScreen();
  }
}

// Mulai dari Halaman Welcome / Lobi / posisi terakhir
boot();
</script>
